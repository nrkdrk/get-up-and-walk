name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: swift --version

      - name: Build
        run: ./build.sh

      - name: Verify bundle
        run: |
          test -x GetUpAndWalk.app/Contents/MacOS/GetUpAndWalk
          plutil -lint GetUpAndWalk.app/Contents/Info.plist
